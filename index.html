<!doctype html>
<html lang="or">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakir Mohan AR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600&family=Noto+Serif+Oriya:wght@600&display=swap">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #f3efe7; --stage: #e6dfd0; --fg: #2a2620; --muted: #776f62; --accent: #1f4d2b; --on-accent: #fff; --chip: rgba(255,255,255,.92);
          --body: "Noto Sans Oriya", system-ui, sans-serif; --display: "Noto Serif Oriya", Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1a17; --stage: #26241f; --fg: #eee8dc; --muted: #a39b8c; --accent: #6fae7f; --on-accent: #10140f; --chip: rgba(44,42,36,.92); color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .top { text-align: center; padding: calc(10px + env(safe-area-inset-top)) 16px 4px; }
  h1 { margin: 0; font: 600 21px var(--display); }
  .caption { margin: 4px 0 0; font-size: 15px; min-height: 2.6em; }
  model-viewer { flex: 1; min-height: 0; width: 100%; background: var(--stage); --poster-color: transparent; }
  .bottom { display: grid; gap: 10px; justify-items: center; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .lines { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .lines button { padding: 9px 14px; border-radius: 20px; border: 1px solid var(--accent); background: var(--chip); color: var(--fg); font: 15px var(--body); }
  .ar-btn { padding: 12px 22px; border: 0; border-radius: 24px; background: var(--accent); color: var(--on-accent); font: 600 16px var(--body); }
  .ar-btn:disabled { opacity: .55; }
  .note { font-size: 11px; color: var(--muted); text-align: center; }
  /* during AR the line buttons move inside the viewer so they stay on the camera view */
  model-viewer .bottom { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
  model-viewer .bottom button { pointer-events: auto; }
  model-viewer .bottom .ar-btn, model-viewer .bottom .note { display: none; }
</style>
</head>
<body>
<div class="top">
  <h1>ଫକୀରମୋହନ ସେନାପତି</h1>
  <p class="caption" id="caption">ଗୋଟିଏ ବଟନ୍ ଦବାନ୍ତୁ…</p>
</div>
<model-viewer id="mv" src="fakir_mohan.glb" alt="3D model of Fakir Mohan Senapati"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls camera-orbit="0deg 85deg auto" field-of-view="30deg"
  shadow-intensity="1" exposure="1.1" animation-name="Idle" autoplay>
  <div slot="ar-button" hidden></div>
</model-viewer>
<div class="bottom" id="controls">
  <div class="lines" id="lines"></div>
  <button class="ar-btn" id="arBtn">ଘରେ ଦେଖନ୍ତୁ · View in your room</button>
  <div class="note" id="note">AI tribute to Fakir Mohan Senapati (1843–1918), Kathasamrat of Odia literature.</div>
</div>

<script>
const LINES = [
  { label: "ନମସ୍କାର",       say: "Namaskar! I am Fakir Mohan Senapati.", bow: true },
  { label: "ମୋ ଜନ୍ମ",        say: "I was born in 1843, in Mallikashpur, in Balasore." },
  { label: "ଛ ମାଣ ଆଠ ଗୁଣ୍ଠ", say: "I wrote the novel, Chha Mana Atha Guntha. Six acres and a third." },
  { label: "କଥାସମ୍ରାଟ",      say: "People call me Kathasamrat. The emperor of stories." },
];
const mv = document.getElementById("mv"), caption = document.getElementById("caption");
let speaking = false, after = null;

function anim(name, once, next) {
  mv.animationName = name;
  after = next || null;
  // let the new clip settle first, or model-viewer restarts it as an endless loop
  mv.updateComplete.then(() => mv.play({ repetitions: once ? 1 : Infinity }));
}
mv.addEventListener("finished", () => { const n = after; after = null; n ? n() : anim("Idle"); });
mv.addEventListener("load", () => {
  anim("Wave", true);
  if (!mv.canActivateAR) { arBtn.disabled = true; arBtn.textContent = "AR isn't available in this browser"; }
}, { once: true });

const arBtn = document.getElementById("arBtn"), controls = document.getElementById("controls");
arBtn.onclick = () => mv.activateAR();
mv.addEventListener("ar-status", e => {
  if (e.detail.status === "session-started") mv.appendChild(controls);           // keep the lines on the camera view
  else if (e.detail.status === "not-presenting" || e.detail.status === "failed") mv.after(controls);
  if (e.detail.status === "failed") document.getElementById("note").textContent = "Couldn't start AR here. Try Chrome on an ARCore phone.";
});

function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  return vs.find(v => v.lang === "en-IN" && /male|ravi|hemant/i.test(v.name) && !/female/i.test(v.name))
      || vs.find(v => v.lang === "en-IN") || vs.find(v => /male/i.test(v.name) && !/female/i.test(v.name)) || vs[0];
}
function talkFor(ms) { speaking = true; anim("Talk"); setTimeout(() => { speaking = false; anim("Idle"); }, ms); }
function speak(line) {
  const startTalk = () => (speaking ? anim("Talk") : null);
  if (line.bow) anim("Namaskar", true, startTalk);
  const fallback = () => { const ms = (1 + line.say.length * 0.07) * 1000; line.bow ? (after = () => talkFor(ms)) : talkFor(ms); };
  if (!("speechSynthesis" in window)) return fallback();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(line.say);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = v ? v.lang : "en-IN"; u.rate = 0.88; u.pitch = 0.75;
  let started = false;
  u.onstart = () => { started = true; speaking = true; if (!line.bow || mv.animationName !== "Namaskar") anim("Talk"); };
  u.onend = () => { speaking = false; if (mv.animationName === "Talk") anim("Idle"); };
  u.onerror = () => { if (!started) { started = true; fallback(); } };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started) { started = true; fallback(); } }, 1500);
}

for (const line of LINES) {
  const b = document.createElement("button");
  b.textContent = line.label;
  b.onclick = () => { caption.textContent = line.say; speak(line); };
  document.getElementById("lines").appendChild(b);
}
</script>
</body>
</html>
